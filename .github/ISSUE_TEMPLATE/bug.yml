name: Bug
description: Something does not work as it should
title: "[bug] "
labels: ["kind/bug"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: The observed behaviour, without interpretation.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, system, browser or commit where it happens.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, traces or screenshots. Remove personal data and secrets before pasting.
    validations:
      required: false
