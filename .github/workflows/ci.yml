name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Unit, adapter and architecture-contract tests; standard library only
      - run: python -m unittest discover -s tests -t . -v
      - run: node --check app.js
